# Streamlit runtime configuration.
# Applied automatically both locally and on Streamlit Community Cloud.

[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111827"
textColor = "#FFFFFF"
font = "sans serif"

[server]
# Allow reasonably large video uploads for detection (MB).
maxUploadSize = 200
headless = true

[browser]
gatherUsageStats = false
